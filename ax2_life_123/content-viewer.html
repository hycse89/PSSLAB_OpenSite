<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LIFE-123: 본문 읽기</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; line-height: 1.8; color: #333; background: #fff; margin: 0; padding: 0; }
        .nav-bar { background: #2c3e50; padding: 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .nav-bar a { color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .nav-bar .title { color: #bdc3c7; font-weight: 700; }
        
        .content-body { max-width: 850px; margin: 50px auto; padding: 0 30px; }
        /* 마크다운 스타일링 */
        h2 { border-bottom: 3px solid #2c3e50; padding-bottom: 10px; margin-top: 50px; color: #2c3e50; }
        h3 { color: #2980b9; margin-top: 35px; background: #f0f7fb; padding: 5px 10px; border-radius: 5px; }
        blockquote { border-left: 5px solid #3498db; padding: 15px 20px; color: #444; font-style: italic; background: #f8f9fa; margin: 25px 0; }
        hr { border: 0; border-top: 1px solid #eee; margin: 50px 0; }
        img { max-width: 100%; border-radius: 10px; margin: 20px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .error-msg { color: #e74c3c; text-align: center; margin-top: 100px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html">← 대시보드로 돌아가기</a>
    <span class="title" id="page-header">LIFE-123 DOCUMENT</span>
    <div style="width: 100px;"></div> </div>

<div class="content-body" id="viewer">
    <p style="text-align: center; color: #999;">본문을 불러오는 중입니다...</p>
</div>

<script>
    // 1. URL 파라미터에서 파일 경로 추출
    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file'); 
    const stageName = urlParams.get('stage') || "";

    if (fileName) {
        document.getElementById('page-header').innerText = `Stage ${stageName} 상세 본문`;
        
        // 2. fetch API를 통해 마크다운 파일 읽기
        fetch(fileName)
            .then(response => {
                if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');
                return response.text();
            })
            .then(text => {
                // 3. 마크다운을 HTML로 변환하여 렌더링
                document.getElementById('viewer').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('viewer').innerHTML = `
                    <div class="error-msg">
                        <h2>앗! 파일을 불러오지 못했습니다.</h2>
                        <p>경로를 확인해 주세요: <strong>${fileName}</strong></p>
                        <a href="index.html">대시보드로 돌아가기</a>
                    </div>`;
            });
    } else {
        document.getElementById('viewer').innerHTML = "<p class='error-msg'>불러올 파일이 지정되지 않았습니다.</p>";
    }
</script>

</body>
</html>
