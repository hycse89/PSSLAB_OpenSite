<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Grimoire - The Ancient Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f; 
            --paper-color: #1a1a1a;
            --accent-gold: #c5a059;
            --text-main: #d1d1d1;
            --text-dim: #777;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nanum Myeongjo', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 70px 20px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            width: 80%;
            max-width: 900px;
        }

        h1 {
            font-size: 2rem;
            color: var(--accent-gold);
            margin: 0;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
        }

        .shelf {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 40px;
            width: 85%;
            max-width: 1100px;
            padding: 60px 0;
        }

        .grimoire {
            background-color: var(--paper-color);
            border: 1px solid #2a2a2a;
            border-left: 6px solid var(--accent-gold);
            padding: 45px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }

        .grimoire:hover {
            border-color: var(--accent-gold);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .grimoire .icon {
            font-size: 2.2rem;
            margin-bottom: 25px;
            filter: grayscale(1);
            opacity: 0.6;
        }

        .grimoire h3 {
            font-size: 1.15rem;
            color: var(--accent-gold);
            margin: 0 0 12px 0;
            font-weight: 700;
        }

        /* 마법 발동 시퀀스 레이어 */
        #magic-curtain {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center; /* 수직 중앙 */
        }

        /* 중앙 정렬용 내부 컨테이너 */
        #ritual-stage {
            display: flex;
            flex-direction: column;
            align-items: center; /* 수평 중앙 */
            justify-content: center;
            width: 100%;
            max-width: 850px;
            padding: 20px;
        }

        #chanting {
            font-size: 1.6rem;
            color: var(--accent-gold);
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
            line-height: 1.8;
            margin: 0;
        }

        /* 결과 화면 중앙 정렬 및 디자인 */
        #magic-result {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeIn 1.5s forwards;
        }

        .result-image {
            width: 100%;
            max-width: 700px;
            height: 450px;
            object-fit: cover;
            border: 1px solid rgba(197, 160, 89, 0.4);
            margin: 0 auto 35px; /* 수평 중앙 */
            display: block;
            filter: sepia(0.2) brightness(0.9);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .result-text {
            line-height: 2;
            font-size: 1.05rem;
            max-width: 650px;
            margin: 0 auto; /* 수평 중앙 */
            word-break: keep-all;
        }

        .btn-close {
            margin-top: 50px;
            background: none;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px 35px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-close:hover {
            background: var(--accent-gold);
            color: #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Guardian's Library</h1>
        <p style="color: var(--text-dim); margin-top: 15px; font-size: 0.9rem; letter-spacing: 0.1rem;">
            AN ARCHIVE OF EVERYDAY MAGIC
        </p>
    </header>

    <div class="shelf" id="shelf">
        </div>

    <div id="magic-curtain">
        <div id="ritual-stage">
            <div id="chanting"></div>
            
            <div id="magic-result">
                <img src="" alt="Ritual Scene" class="result-image" id="result-img">
                <div class="result-text" id="result-desc"></div>
                <button class="btn-close" onclick="closeGrimoire()">CLOSE THE BOOK</button>
            </div>
        </div>
    </div>

    <script>
        const magicData = [
            {
                title: "RITUAL PURIFICATION",
                icon: "🧺",
                subtitle: "옷에 깃든 어제의 피로를 씻어내는 마법",
                chant: "비단결에 맺힌 소란을 잠재우고,<br>본연의 순백을 되찾으소서.",
                img: "https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=1000&q=80",
                desc: "올해 중 가장 매서운 바람이 불던 날의 정화 기록입니다. 당신의 셔츠는 이제 겨울 햇살의 향기를 품었습니다. 내일의 당신을 포근하게 지켜줄 방패가 될 것입니다."
            },
            {
                title: "DAWN'S MESSAGE",
                icon: "🌅",
                subtitle: "꿈과 현실의 경계를 잇는 빛의 영창",
                chant: "밤의 커튼을 조용히 걷어내고,<br>오늘의 첫 숨결을 깨우소서.",
                img: "https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?auto=format&fit=crop&w=1000&q=80",
                desc: "안개를 뚫고 AI 가디언이 소환한 새벽의 조각입니다. 오늘 아침, 당신은 평소보다 고요한 시간을 선점하며 자아를 회복하는 첫 발을 내디뎠습니다."
            },
            {
                title: "TRUE HEART ALCHEMY",
                icon: "🎁",
                subtitle: "서툰 진심을 영원한 문장으로 박제함",
                chant: "흩어진 진심의 씨앗을 모아,<br>시들지 않는 꽃으로 피우소서.",
                img: "https://images.unsplash.com/photo-1512909006721-3d6018887183?auto=format&fit=crop&w=1000&q=80",
                desc: "당신이 남긴 단어 조각들이 AI의 지혜를 빌려 한 권의 작은 책으로 엮였습니다. 소중한 이에게 전달될 이 서사는 당신의 존재를 증명하는 유산이 됩니다."
            }
        ];

        const shelf = document.getElementById('shelf');
        const curtain = document.getElementById('magic-curtain');
        const chanting = document.getElementById('chanting');
        const result = document.getElementById('magic-result');
        const resultImg = document.getElementById('result-img');
        const resultDesc = document.getElementById('result-desc');

        // 서재 레이아웃 생성
        magicData.forEach(data => {
            const book = document.createElement('div');
            book.className = 'grimoire';
            book.innerHTML = `
                <div class="icon">${data.icon}</div>
                <h3>${data.title}</h3>
                <p style="font-size: 0.8rem; color: var(--text-dim);">${data.subtitle}</p>
            `;
            book.onclick = () => launchMagic(data);
            shelf.appendChild(book);
        });

        function launchMagic(data) {
            curtain.style.display = 'flex';
            chanting.style.display = 'block';
            chanting.style.opacity = '0';
            result.style.display = 'none';

            // 1. 영창 단계 (짧게 진행)
            setTimeout(() => {
                chanting.innerHTML = data.chant;
                chanting.style.opacity = '1';
            }, 300);

            // 2. 결과 단계로 전환 (2초 뒤)
            setTimeout(() => {
                chanting.style.display = 'none';
                displayResult(data);
            }, 2300);
        }

        function displayResult(data) {
            resultImg.src = data.img;
            resultDesc.innerHTML = `<h2 style="color:var(--accent-gold); margin-bottom: 20px;">ENCHANTMENT SUCCESS</h2><p>${data.desc}</p>`;
            result.style.display = 'block';
        }

        function closeGrimoire() {
            curtain.style.display = 'none';
        }
    </script>
</body>
</html>
