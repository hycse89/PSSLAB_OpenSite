<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>현자들의 속삭임 - Whispers of Sages</title>
    <style>
        body { background: #050505; color: #a1a1a1; font-family: 'Nanum Myeongjo', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .module { width: 90%; max-width: 600px; background: #0a0a0a; border: 1px solid #c5a059; padding: 40px; text-align: center; }
        .sage-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .sage-btn { width: 80px; height: 80px; border-radius: 50%; border: 1px solid #333; cursor: pointer; transition: 0.3s; filter: grayscale(100%); overflow: hidden; }
        .sage-btn:hover, .sage-btn.active { border-color: #c5a059; filter: grayscale(0%); transform: scale(1.1); }
        .sage-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        #voice-visualizer { height: 60px; display: flex; align-items: center; justify-content: center; gap: 5px; margin: 30px 0; visibility: hidden; }
        .bar { width: 4px; background: #c5a059; animation: sound 0.5s infinite alternate; }
        @keyframes sound { from { height: 10px; } to { height: 50px; } }

        .quote-box { font-size: 1.3rem; color: #c5a059; line-height: 1.8; min-height: 100px; margin-top: 20px; font-style: italic; }
        .ai-commentary { font-size: 0.9rem; color: #666; margin-top: 20px; border-top: 1px solid #222; padding-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="module">
        <h2 style="color:#c5a059; letter-spacing: 3px;">현자들의 속삭임</h2>
        <p style="font-size:0.8rem; margin-bottom:30px;">당신의 고민에 답해줄 시공간 너머의 목소리를 선택하십시오.</p>
        
        <div class="sage-selector">
            <div class="sage-btn" onclick="selectSage('nietzsche', this)" title="니체">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Nietzsche187a.jpg" alt="니체">
            </div>
            <div class="sage-btn" onclick="selectSage('kant', this)" title="칸트">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Immanuel_Kant_paiting.png" alt="칸트">
            </div>
            <div class="sage-btn" onclick="selectSage('fromm', this)" title="에리히 프롬">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Erich_Fromm_1974.jpg" alt="프롬">
            </div>
        </div>

        <div id="voice-visualizer">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
        </div>

        <div id="display-area">
            <div class="quote-box" id="quote-text">"당신을 지켜줄 지혜의 목소리를 소환 대기 중..."</div>
            <div class="ai-commentary" id="comment-text">현자의 말씀 뒤에는 가디언의 현대적 해석이 덧붙여집니다.</div>
        </div>

        <button class="btn" style="margin-top:40px; background:none; border:1px solid #c5a059; color:#c5a059; padding:10px 20px; cursor:pointer;" onclick="summonWisdom()">지혜 소환하기</button>
    </div>

    <script>
        let currentSage = '';
        function selectSage(id, el) {
            currentSage = id;
            document.querySelectorAll('.sage-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function summonWisdom() {
            if(!currentSage) return alert("현자를 먼저 선택하십시오.");
            
            const visualizer = document.getElementById('voice-visualizer');
            const quote = document.getElementById('quote-text');
            const comment = document.getElementById('comment-text');

            visualizer.style.visibility = 'visible';
            quote.innerText = "시간의 틈새에서 목소리를 정제하고 있습니다...";
            
            setTimeout(() => {
                visualizer.style.visibility = 'hidden';
                if(currentSage === 'nietzsche') {
                    quote.innerText = '"나를 죽이지 못하는 고통은 나를 더 강하게 만든다."';
                    comment.innerText = "니체는 당신의 시련을 단순한 불행이 아닌, '위버멘쉬(초인)'로 나아가기 위한 단련이라 말합니다. 당신의 고통은 헛되지 않습니다.";
                } else if(currentSage === 'kant') {
                    quote.innerText = '"너의 의지의 준칙이 항상 동시에 보편적 입법의 원리가 되도록 행위하라."';
                    comment.innerText = "칸트는 지금 당신의 선택이 세상의 기준이 될 수 있는지 묻습니다. 당신의 양심이 가리키는 그 길을 따르십시오.";
                } else if(currentSage === 'fromm') {
                    quote.innerText = '"사랑은 능동적인 행위이며, 누군가의 영혼을 보살피는 기술이다."';
                    comment.innerText = "프롬은 사랑을 받는 행운이 아닌, 주체적으로 행하는 기술이라 정의합니다. 오늘 누군가에게 먼저 따뜻함을 전해보는 건 어떨까요?";
                }
            }, 3000);
        }
    </script>
</body>
</html>
