<!-- PSSLAB Graph Viewer 1.2 -->
<!-- Last Update : 2025.05.31 -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PSSLAB Tree Graph Viewer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f9f9f9;
    }
  </style>  
</head>
<body>
  <h2 id="header-title">로딩 중...</h2>

  <!-- TOOLTIP 추가 -->
  <div id="tooltip" style="
    position: absolute;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    pointer-events: none;
    font-size: 20px;
    display: none;
    z-index: 10;
  "></div>  

  <div id="chart"></div>

  <!-- 폰트 지정 -->
  <style>
    #chart svg text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
    }
  </style>

  <script type="module">
    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        header: params.get("header") || "기본 제목",
        file: params.get("file") || "tree_graph.md"
      };
    }

    function parseMarkdownTree(markdown) {
      const lines = markdown.split('\n').filter(line => line.trim().startsWith('-'));
      const stack = [];
      const root = { name: "root", children: [] };
    
      for (let line of lines) {
        const depth = line.search(/\S/) / 2;
        let name = line.trim().slice(2).trim();
    
        // URL 추출
        const urlMatch = name.match(/\((https?:\/\/[^\)]+)\)$/);
        let url = null;
        if (urlMatch) {
          url = urlMatch[1];
          name = name.replace(/\s*\(https?:\/\/[^\)]+\)$/, '');
        }
    
        const node = { name };
        if (url) node.url = url;
    
        if (depth === 0) {
          root.children.push(node);
          stack[0] = node;
        } else {
          const parent = stack[depth - 1];
          if (!parent.children) parent.children = [];
          parent.children.push(node);
          stack[depth] = node;
        }
      }
    
      return root.children.length === 1 ? root.children[0] : root;
    }

    const { header, file } = getParams();
    document.getElementById("header-title").textContent = header;

    fetch(file)
      .then(response => response.text())
      .then(markdown => {
        const data = parseMarkdownTree(markdown);
        document.getElementById("chart").appendChild(drawTree(data));
      });

    function drawTree(data) {
      const width = window.innerWidth;
      const root = d3.hierarchy(data);
      const dx = 20;
      const dy = width / (root.height + 1);
      const tree = d3.tree().nodeSize([dx, dy]);

      // root.sort((a, b) => d3.ascending(a.data.name, b.data.name));
      tree(root);

      let x0 = Infinity;
      let x1 = -x0;
      root.each(d => {
        if (d.x > x1) x1 = d.x;
        if (d.x < x0) x0 = d.x;
      });

      const height = x1 - x0 + dx * 2;
      const marginRight = 300;
      const charWidth = 6;      
      const maxRight = d3.max(root.descendants(), d => d.y + d.data.name.length * charWidth);   
      const viewBoxWidth = maxRight + marginRight;
      const rootTextWidth = root.data.name.length * charWidth;
      const marginLeft = Math.max(100, rootTextWidth + 40);

      const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [-marginLeft, x0 - dx, viewBoxWidth + marginLeft, height])
        .attr("preserveAspectRatio", "xMinYMin meet")
        .attr("style", "max-width: 100%; height: auto; font: 10px sans-serif;");

      svg.append("g")
        .attr("fill", "none")
        .attr("stroke", "#555")
        .attr("stroke-opacity", 0.4)
        .attr("stroke-width", 1.5)
        .selectAll("path")
        .data(root.links())
        .join("path")
        .attr("d", d3.linkHorizontal()
          .x(d => d.y)
          .y(d => d.x));

      const node = svg.append("g")
        .attr("stroke-linejoin", "round")
        .attr("stroke-width", 3)
        .selectAll("g")
        .data(root.descendants())
        .join("g")
        .attr("transform", d => `translate(${d.y},${d.x})`);

      node.append("circle")
        .attr("fill", d => d.children ? "#555" : "#999")
        .attr("r", 4);

      node.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => d.children ? -8 : 8)
        .attr("text-anchor", d => d.children ? "end" : "start")
        .attr("stroke", "white")
        .attr("paint-order", "stroke")
        .style("fill", d => d.data.url ? "blue" : "black")
        .style("text-decoration", d => d.data.url ? "underline" : "none")
        .each(function(d) {
          const name = d.data.name;
          const match = name.match(/\*\*(.*?)\*\*/);
          const textEl = d3.select(this);

          if (match) {
            const [fullMatch, boldText] = match;
            const [before, after] = name.split(fullMatch);

            if (before) textEl.append("tspan").text(before);
            textEl.append("tspan")
              .text(boldText)
              .attr("font-weight", "bold");
            if (after) textEl.append("tspan").text(after);
          } else {
            textEl.text(name);
          }
        })
        .on("click", (event, d) => {
          if (d.data.url) {
            window.open(d.data.url, '_blank');
            event.stopPropagation();
          }
        });

      const tooltip = d3.select("#tooltip");

      node
        .on("mouseover", function (event, d) {
          const children = d.children || d._children;
          const childList = children
            ? "<ul style='margin:0; padding-left:1em;'>" +
              children.map(c => `<li>${c.data.name}</li>`).join("") +
              "</ul>"
            : "";

          tooltip
            .style("display", "block")
            .html(`<strong>${d.data.name}</strong>${childList}`);
        })
        .on("mousemove", function (event) {
          tooltip
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY + 10) + "px");
        })
        .on("mouseout", function () {
          tooltip.style("display", "none");
        });

      return svg.node();
    }
  </script>
</body>
</html>
