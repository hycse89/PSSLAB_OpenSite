<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Center Align</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });
    </script>
    <style>
        /* 전체 페이지 중앙 정렬 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        /* Mermaid 다이어그램 컨테이너 */
        .mermaid-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90vw;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Mermaid 내부 SVG 중앙 정렬 */
        .mermaid {
            text-align: center;  /* 텍스트 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;          /* 전체 박스를 차지하도록 설정 */
        }

        /* Mermaid 다이어그램 내부 요소 정렬 */
        .mermaid svg {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="mermaid-container">
        <div class="mermaid">
            graph TD;
            A[AX Dashboard] -->|Flowchart| B[AX Flow]
            A -->|Class Diagram| C[AX Class]
            A -->|Gantt Chart| D[AX Gantt]
            A -->|Sequence Diagram| E[AX Sequence]
        </div>
    </div>

</body>
</html>
