<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Hover Effect</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });
    </script>
    <style>
        /* 기본 스타일 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .mermaid {
            width: 80%;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Hover 시 색상 반전 */
        .mermaid svg g.node rect:hover {
            fill: yellow !important;
            stroke: black !important;
        }

        .mermaid svg g.node text:hover {
            fill: black !important;
        }
    </style>
</head>
<body>

    <div class="mermaid">
        flowchart LR
        A[AX Platform] --> B[Hybrid xLM]
        A --> C[AI NCLC]
        A --> D[AI Lake]
        A --> E[Digital Worker]
        A --> F[Digital DNA]
    </div>

</body>
</html>
