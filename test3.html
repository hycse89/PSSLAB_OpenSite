<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Screen Mermaid</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });
    </script>
    <style>
        /* 전체 페이지 크기 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            overflow: hidden;
        }

        /* Mermaid 다이어그램 전체 크기 설정 */
        .mermaid-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        /* Mermaid 내부 다이어그램 조정 */
        .mermaid {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mermaid 내부 SVG 크기 조정 */
        .mermaid svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="mermaid-container">
        <div class="mermaid">
            graph TD;
            A[AX Dashboard] -->|Flowchart| B[AX Flow]
            A -->|Class Diagram| C[AX Class]
            A -->|Gantt Chart| D[AX Gantt]
            A -->|Sequence Diagram| E[AX Sequence]
        </div>
    </div>

</body>
</html>
