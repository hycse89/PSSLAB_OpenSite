<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AX² SYSTEM Vision</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --border-color: #30363d;
            --title-color: #f0f6fc;
            --accent-color: #58a6ff;
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            font-family: var(--font-main);
        }

        /* 전체 레이아웃 래퍼 */
        .wrapper {
            width: 80%;
            max-width: 850px;
        }

        /* 상단 제목 스타일 */
        .box-title {
            font-size: 2.0rem;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 5px solid var(--accent-color);
            display: flex;
            align-items: center;
        }

        /* 메인 박스 컨테이너 */
        #display-container {
            height: 400px;
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--container-bg);
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            line-height: 1.8;
            position: relative;
        }

        /* 스크롤바 디자인 */
        #display-container::-webkit-scrollbar {
            width: 8px;
        }
        #display-container::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        .line {
            margin-bottom: 25px;
            display: block;
            min-height: 1.2em;
        }

        /* 커서 애니메이션 */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: var(--accent-color);
            margin-left: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 문장별 스타일 커스텀 */
        .style-line1 { color: #8b949e; font-size: 0.9rem; }
        .style-line2 { color: #58a6ff; font-size: 1.0rem; font-weight: 600; }
        .style-line3 { color: #7ee787; font-size: 1.0rem; font-weight: 600; }
        .style-line4 { color: #d2a8ff; font-size: 1.0rem; font-weight: 600; }
        .style-line5 { color: #c75b03; font-size: 1.0rem; font-weight: 600; }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="box-title">
        <a href="https://hycse89.github.io/PSSLAB_OpenSite/OPEN2026/ax2_sales/index.html" style="color: inherit; text-decoration: none;">
            AX² System - Model 개요
        </a>
    </div>
    <div id="display-container">
        <div id="text-output"></div>
        <span id="cursor" class="cursor"></span>
    </div>
</div>

<script>
    const outputElement = document.getElementById('text-output');
    const container = document.getElementById('display-container');
    const cursor = document.getElementById('cursor');

    const scriptLines = [
        { text: "AX² System - Model에서 model이란 LLM/SLM만을 의미하지 않습니다. xM(Extended Model)을 지향합니다.", className: "style-line1" },
        { text: "(1) AX² System Model에서 xM이란 언어모델, 수치모델, 정보모델 등을 모두 포함합니다.", className: "style-line5" },
        { text: "(2) AX² System Model에서는 LLM/SLM 뿐만 아니라 Primitive Model 같은 Tiny,CPU,Subject Model도 고려합니다.", className: "style-line4" },
        { text: "(3) AX² System Model에서는 숫자 세기를 못하는 LLM을 위한 수치전문 모델로 결정론적 결과를 보여줍니다.", className: "style-line2" },        
        { text: "(4) AX² System Model에서는 환각을 원천적으로 제거하는 Hybrid Information Model(정보모델)을 제시합니다.", className: "style-line3" },
        { text: "그리고 이 모든 모델을 Orchestration할 수 있는 기능 및 방법을 제시합니다.", className: "style-line1" },        
    ];

    let lineIndex = 0;
    let charIndex = 0;
    const typingSpeed = 60; // 타이핑 속도

    function typeLine() {
        if (lineIndex < scriptLines.length) {
            const currentLine = scriptLines[lineIndex];
            
            if (charIndex === 0) {
                const newLineDiv = document.createElement('div');
                newLineDiv.className = `line ${currentLine.className}`;
                newLineDiv.id = `line-${lineIndex}`;
                outputElement.appendChild(newLineDiv);
                newLineDiv.appendChild(cursor); // 커서를 현재 줄로 이동
            }

            const currentDiv = document.getElementById(`line-${lineIndex}`);
            
            if (charIndex < currentLine.text.length) {
                const char = document.createTextNode(currentLine.text.charAt(charIndex));
                currentDiv.insertBefore(char, cursor);
                charIndex++;
                
                // 스크롤 효과: 텍스트가 추가될 때마다 바닥으로 스크롤
                container.scrollTop = container.scrollHeight;
                
                setTimeout(typeLine, typingSpeed);
            } else {
                lineIndex++;
                charIndex = 0;
                setTimeout(typeLine, 1000); // 다음 문장 시작 전 대기
            }
        }
    }

    window.onload = typeLine;
</script>

</body>
</html>
