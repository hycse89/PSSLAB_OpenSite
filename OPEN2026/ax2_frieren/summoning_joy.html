<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>행복의 소환술 - Summoning Joy</title>
    <style>
        body { background: #111; color: #eee; font-family: 'Nanum Myeongjo', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .module { background: #1a1a1a; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
        h1 { color: #ffb7c5; /* 부드러운 핑크/골드 톤 */ font-size: 1.5rem; margin-bottom: 5px; }
        .sub { color: #888; font-size: 0.8rem; margin-bottom: 30px; }
        
        .image-frame { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; overflow: hidden; border: 3px solid #333; position: relative; }
        .image-frame img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        .loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; color: #ffb7c5; visibility: hidden; }
        
        .cast-btn { margin-top: 30px; background: #ffb7c5; color: #1a1a1a; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .cast-btn:hover { transform: scale(1.05); background: #ffcce0; }
        .caption { margin-top: 20px; font-size: 0.9rem; color: #aaa; font-style: italic; min-height: 30px; }
    </style>
</head>
<body>
    <div class="module">
        <h1>행복의 소환술</h1>
        <p class="sub">세상에서 가장 무해한 존재들을 연성합니다.</p>

        <div class="image-frame">
            <img id="joyImage" src="https://source.unsplash.com/featured/?cute,animal" alt="Joyful Image">
            <div class="loading-overlay" id="loading">마력 응집 중...</div>
        </div>
        
        <div class="caption" id="imgCaption">"이 작은 생명체의 평온함이 당신에게 닿기를."</div>
        <button class="cast-btn" onclick="castJoySpell()">다시 소환하기 ✨</button>
    </div>

    <script>
        const keywords = ["cute animal", "cozy vibes", "peaceful nature", "baby animal sleeping", "warm sunlight"];
        const captions = [
            "우주에서 가장 포근한 순간을 포착했습니다.",
            "걱정은 잠시 내려놓으세요. 이 평화는 당신 것입니다.",
            "보기만 해도 미소가 지어지는 무해한 존재입니다.",
            "당신의 지친 하루에 작은 쉼표를 선물합니다."
        ];

        function castJoySpell() {
            const img = document.getElementById('joyImage');
            const loading = document.getElementById('loading');
            const cap = document.getElementById('imgCaption');
            
            loading.style.visibility = 'visible';
            img.style.opacity = 0.5;
            
            // 랜덤 키워드로 새로운 이미지 요청 (Unsplash Source 활용)
            const randomKeyword = keywords[Math.floor(Math.random() * keywords.length)];
            const randomCaption = captions[Math.floor(Math.random() * captions.length)];
            const newSrc = `https://source.unsplash.com/featured/?${randomKeyword}&t=${new Date().getTime()}`; // 시간 추가로 캐싱 방지

            img.onload = () => {
                loading.style.visibility = 'hidden';
                img.style.opacity = 1;
                cap.innerText = `"${randomCaption}"`;
            };
            img.src = newSrc;
        }
    </script>
</body>
</html>
